# 网关服务器配置文件
# Gateway Server Configuration

# ========== 网络端口配置 ==========
# Network Ports
gateway.tcp.port=8000
gateway.websocket.port=8100
gateway.http.port=8200

# ========== 连接配置 ==========
# Connection Configuration
gateway.max.connections=10000
gateway.max.requests.per.second=100

# ========== 安全配置 ==========
# Security Configuration
gateway.security.blackwhitelist.enable=true
gateway.security.ratelimiter.enable=true
gateway.security.signature.enable=true
gateway.security.anticheat.enable=true

# ========== 跨服配置 ==========
# Cross-Server Configuration
gateway.crossserver.match.enable=true
gateway.crossserver.team.enable=true
gateway.match.timeout=30
gateway.team.maxsize=5
