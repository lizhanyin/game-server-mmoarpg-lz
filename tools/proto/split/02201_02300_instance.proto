// 02201_02300_instance.proto
// 副本相关消息 msgid 范围 2201-2300
syntax = "proto2";

package org.gof.demo.worldsrv.msg;

import "google/protobuf/descriptor.proto";
import "options.proto";
import "00000_00000_def.proto";

// ============================================================
// 副本相关消息
// ============================================================

// MsgID: 2201
// 进入副本
message CSInstanceEnter {
  option (msgid) = 2201;
  optional int32 instSn = 1;         // 副本sn，用于判断副本类型
}

// MsgID: 2202
// 离开副本
message CSInstanceLeave {
  option (msgid) = 2202;
}

// MsgID: 2203
// 结束副本
message CSInstanceEnd {
  option (msgid) = 2203;
}

// MsgID: 2204
// 副本结束
message SCInstanceEnd {
  option (msgid) = 2204;
  optional int32 instSn = 1;             // 副本sn
  repeated int32 stars = 2;             // 副本星星数组
  repeated DProduce lotteryProduces = 3; // 抽奖产出物
  repeated DProduce produces = 4;       // 产出物品
  optional int32 humanExp = 5;          // 角色经验
  optional int32 generalExp = 6;         // 伙伴经验
  optional int32 income = 7;             // 金币收益
}

// MsgID: 2207
// 章节更新
message SCUpdateChapter {
  option (msgid) = 2207;
  optional DChapterInfo info = 1;
}

// MsgID: 2208
// 所有章节
message SCAllChapter {
  option (msgid) = 2208;
  repeated DChapterInfo infos = 1;
}

// MsgID: 2209
// 副本自动战斗
message CSInstanceAuto {
  option (msgid) = 2209;
  optional int32 instSn = 1;         // 副本sn
  optional int32 num = 2;            // 次数
}

// MsgID: 2210
// 副本自动战斗
message SCInstanceAuto {
  option (msgid) = 2210;
  repeated DProduce produces = 1;       // 产出物品
  optional int32 income = 2;            // 金币收益
  optional int32 humanExp = 3;          // 角色经验
}

// MsgID: 2212
// 领取宝箱奖励
message CSBoxAward {
  option (msgid) = 2212;
  optional int32 chapterId = 1;      // 章节ID
  optional int32 index = 2;          // 索引
}

// MsgID: 2213
// 宝箱奖励
message SCBoxAward {
  option (msgid) = 2213;
  optional int32 code = 1;         // 成功
  optional int32 chapterId = 2;    // 无注释
  optional int32 index = 3;        // 无注释
}

// MsgID: 2214
// 副本抽奖
message CSInstanceLottery {
  option (msgid) = 2214;
}

// MsgID: 2215
// 副本抽奖
message SCInstanceLottery {
  option (msgid) = 2215;
  optional DProduce produce = 1;      // 得到的产出物
}
