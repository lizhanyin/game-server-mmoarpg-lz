// 02301_02800_items.proto
// 物品装备相关消息 msgid 范围 2301-2800
syntax = "proto2";

package org.gof.demo.worldsrv.msg;

import "google/protobuf/descriptor.proto";
import "options.proto";
import "00000_00000_def.proto";

// ============================================================
// 物品装备相关消息
// ============================================================

// MsgID: 2301
// 修改名字
message CSChangeName {
  option (msgid) = 2301;
  required string name = 1;
}

// MsgID: 2302
// 修改名字结果
message SCChangeNameResult {
  option (msgid) = 2302;
  required bool result = 1;
  optional string shield = 2;  // 如果是false的话，这个字段就是非法字
}

// MsgID: 2303
// 修改名字任务完成
message SCChangeNameQuestFinish {
  option (msgid) = 2303;
  required int32 sn = 1;
}

// MsgID: 2304
// 随机名字
message CSChangeNameRandom {
  option (msgid) = 2304;
}

// MsgID: 2305
// 随机名字结果
message SCChangeNameRandomResult {
  option (msgid) = 2305;
  required int32 result = 1;
  optional string name = 2;
}

// MsgID: 2401
// 添加邮件
message SCAddMail {
  option (msgid) = 2401;
  required DMail mail = 1;
}

// MsgID: 2402
// 邮件列表
message CSMailList {
  option (msgid) = 2402;
}

// MsgID: 2403
// 邮件列表
message SCMailList {
  option (msgid) = 2403;
  repeated DMail mails = 1;
}

// MsgID: 2404
// 读取邮件
message CSReadMail {
  option (msgid) = 2404;
  required int64 id = 1;
}

// MsgID: 2405
// 领取邮件附件
message CSPickupMail {
  option (msgid) = 2405;
  required int64 id = 1;
}

// MsgID: 2406
// 领取邮件附件
message SCPickupMail {
  option (msgid) = 2406;
  required int32 code = 1;         // 结果码
  optional string reason = 2;      // 原因
  repeated DItem items = 3;
}

// MsgID: 2407
// 领取所有邮件附件
message CSPickupAllMail {
  option (msgid) = 2407;
}

// MsgID: 2408
// 领取所有邮件附件
message SCPickupAllMail {
  option (msgid) = 2408;
  required int32 code = 1;         // 结果码
  optional string reason = 2;      // 原因
  repeated DItem items = 3;
}

// MsgID: 2409
// 请求清理邮件（有删除的进行删除）
message CSClearMail {
  option (msgid) = 2409;
}

// MsgID: 2410
// 删除邮件
message SCDeleteMail {
  option (msgid) = 2410;
  repeated int64 ids = 1;
}

// MsgID: 2411
// 检查邮件是否可删除
message CSCheckMailRemoveable {
  option (msgid) = 2411;
  repeated int64 ids = 1;
}

// MsgID: 2412
// 检查邮件是否可删除
message SCCheckMailRemoveable {
  option (msgid) = 2412;
  repeated int64 ids = 1;
  optional int64 spanTime = 2;  // 剩余时间
}

// MsgID: 2501
// 领取活跃度奖励
message CSRsvLivenessAwards {
  option (msgid) = 2501;
  optional int32 code = 1;       // 每日活动活跃度ID
}

// MsgID: 2502
// 领取活跃度奖励结果
message SCRsvLivenessAwardsResult {
  option (msgid) = 2502;
  optional int32 code = 1;       // 每日活动活跃度ID
}

// MsgID: 2503
// 打开活跃度界面
message CSOpenLivenessUI {
  option (msgid) = 2503;
}

// MsgID: 2504
// 活跃度信息
message SCLivenessInfo {
  option (msgid) = 2504;
  repeated DLiveness liveness = 1;
  repeated int32 awardsRsvd = 2;       // 已经领取多少活跃度的奖品
}

// MsgID: 2601
// 装备强化
message CSEquipUp {
  option (msgid) = 2601;
  required int64 humanId = 1;
  required int32 index = 2;          // 装备位置
}

// MsgID: 2602
// 装备强化
message SCEquipUp {
  option (msgid) = 2602;
  optional int32 index = 1;         // 装备穿戴成功后所在的装备位
  optional int32 bagIndex = 2;      // 装备在背包中的位置
}

// MsgID: 2603
// 卸下装备
message CSEquipDown {
  option (msgid) = 2603;
  required int64 humanId = 1;
  required int32 index = 2;          // 装备位置
}

// MsgID: 2604
// 卸下装备
message SCEquipDown {
  option (msgid) = 2604;
  required int32 code = 1;
}

// MsgID: 2605
// 装备分解
message CSEquipReclaim {
  option (msgid) = 2605;
  required int64 humanId = 1;
  repeated int32 indexList = 2;    // 要分解的装备位置列表
}

// MsgID: 2606
// 装备分解
message SCEquipReclaim {
  option (msgid) = 2606;
  required int32 code = 1;
  repeated DItem items = 2;
}

// MsgID: 2608
// 装备变化广播
message SCEquipChangeBoardcast {
  option (msgid) = 2608;
  required int64 humanId = 1;
  optional DHuman human = 2;
}

// MsgID: 2609
// 部位强化
message CSPartQianghua {
  option (msgid) = 2609;
  required int64 humanId = 1;
  required int32 part = 2;           // 部位
}

// MsgID: 2610
// 部位强化
message SCPartQianghua {
  option (msgid) = 2610;
  required int32 code = 1;
}

// MsgID: 2611
// 部位重铸
message CSPartChongxing {
  option (msgid) = 2611;
  required int64 humanId = 1;
  required int32 part = 2;           // 部位
  optional int32 phase = 3;         // 阶段
  optional int32 seekPos = 4;       // 目标位置
}

// MsgID: 2612
// 部位重铸
message SCPartChongxing {
  option (msgid) = 2612;
  required int32 code = 1;
  optional int32 grade = 2;          // 重铸后的等级
}

// MsgID: 2701
// 穿宝石
message CSGemUp {
  option (msgid) = 2701;
  optional int32 part = 1;          // 装备位
  optional int32 bagIndex = 2;      // 背包中的位置
}

// MsgID: 2703
// 全部宝石升级
message CSGemUpAll {
  option (msgid) = 2703;
  required int64 humanId = 1;
  required int32 part = 2;
}

// MsgID: 2704
// 设置宝石
message SCSetGem {
  option (msgid) = 2704;
  required int32 code = 1;
  repeated int32 posInfo = 2;        // 位置信息数组
}

// MsgID: 2705
// 卸下宝石
message CSGemDown {
  option (msgid) = 2705;
  required int64 humanId = 1;
  required int32 part = 2;
  required int32 slot = 3;
}

// MsgID: 2707
// 全部卸下宝石
message CSGemDownAll {
  option (msgid) = 2707;
  required int64 humanId = 1;
  required int32 part = 2;
}

// MsgID: 2709
// 宝石合成
message CSGemComposite {
  option (msgid) = 2709;
  required int32 bagIndex = 1;
}

// MsgID: 2710
// 宝石合成
message SCGemComposite {
  option (msgid) = 2710;
  required int32 code = 1;
  optional int32 sn = 2;             // 宝石sn
}

// MsgID: 2711
// 宝石合成至顶级
message CSGemCompositeTop {
  option (msgid) = 2711;
  required int32 bagIndex = 1;
}

// MsgID: 2712
// 宝石合成至顶级
message SCGemCompositeTop {
  option (msgid) = 2712;
  required int32 code = 1;
}

// MsgID: 2713
// 全部宝石合成至顶级
message CSGemCompositeAllTop {
  option (msgid) = 2713;
}

// MsgID: 2714
// 全部宝石合成至顶级
message SCGemCompositeAllTop {
  option (msgid) = 2714;
  required int32 code = 1;
}

// MsgID: 2801
// 抽卡
message CSGatcha {
  option (msgid) = 2801;
  optional int32 tType = 1;           // 抽奖类型：1初级2中级3高级
}

// MsgID: 2802
// 抽卡10次
message CSGatcha10 {
  option (msgid) = 2802;
  optional int32 tType = 1;           // 抽奖类型：1初级2中级
}

// MsgID: 2803
// 抽卡结果
message SCGatcha {
  option (msgid) = 2803;
  repeated int32 itemAndNum = 1;          // 物品和数量
  optional DTreasure treasure = 2;        // 最新的宝藏信息
}
