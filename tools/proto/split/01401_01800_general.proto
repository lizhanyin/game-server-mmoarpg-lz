// 01401_01800_general.proto
// 武将相关消息 msgid 范围 1401-1800
syntax = "proto2";

package org.gof.demo.worldsrv.msg;

import "google/protobuf/descriptor.proto";
import "options.proto";
import "00000_00000_def.proto";

// ============================================================
// 武将相关消息
// ============================================================

// MsgID: 1401
// 物品使用
message CSUseItem {
  option (msgid) = 1401;
  optional int32 type = 1;          // 背包类型号
  optional int32 index = 2;         // 背包格位置
  optional int32 num = 3;           // 使用数量
}

// MsgID: 1403
// 整理背包
message CSArrangeBag {
  option (msgid) = 1403;
  required int32 type = 1;
}

// MsgID: 1405
// 物品批量出售
message CSItemBachSell {
  option (msgid) = 1405;
  optional int32 type = 1;          // 背包类型号
  repeated int32 polist = 2;        // 背包格位置集合
}

// MsgID: 1407
// 扩展背包
message CSBagExpand {
  option (msgid) = 1407;
  optional int32 type = 1;          // 背包号（1主2次）
  optional int32 toIndex = 2;       // 要扩到的格
}

// MsgID: 1408
// 背包扩展结果
message SCBagExpand {
  option (msgid) = 1408;
  optional int32 code = 1;         // 提示码 (0:成功，其他：失败)
  optional string reason = 2;      // 提示信息
  optional int32 toIndex = 3;      // 扩容后的格子数
}

// MsgID: 1501
// 发送聊天
message CSInformChat {
  option (msgid) = 1501;
  required string content = 1;
  required int32 channel = 2;
}

// MsgID: 1502
// 消息通知
message SCInformMsg {
  option (msgid) = 1502;
  optional int32 channel = 1;          // 频道
  optional string content = 2;         // 内容
  optional int64 sendHumanId = 3;      // 玩家ID
  optional string sendHumanName = 4;   // 玩家昵称
  optional int64 campId = 5;           // 阵营ID
  optional bool isSys = 6;             // 是否是系统
}

// MsgID: 1504
// 全服消息通知
message SCInformMsgAll {
  option (msgid) = 1504;
  required int32 type = 1;
  required string content = 2;
}

// MsgID: 1901
// 获取武将列表
message CSGeneralList {
  option (msgid) = 1901;
}

// MsgID: 1902
// 武将列表
message SCGeneralList {
  option (msgid) = 1902;
  repeated DGeneralInfo units = 1;
}

// MsgID: 1903
// 获取武将信息
message CSGeneralInfo {
  option (msgid) = 1903;
  required int64 id = 1;
}

// MsgID: 1904
// 武将信息
message SCGeneralInfo {
  option (msgid) = 1904;
  required DGeneralInfo unit = 1;
}

// MsgID: 1905
// 招募武将
message CSGeneralRecruit {
  option (msgid) = 1905;
  required string sn = 1;
}

// MsgID: 1906
// 武将招募结果
message SCGeneralRecruitResult {
  option (msgid) = 1906;
  required string sn = 1;       // 伙伴SN
  required bool result = 2;
}

// MsgID: 1907
// 武将添加经验
message CSGeneralExpAdd {
  option (msgid) = 1907;
  required int64 id = 1;         // 伙伴ID
  required int32 propSn = 2;     // 经验丹SN
  optional int32 propNum = 3 [default = 1];  // 经验丹数量
}

// MsgID: 1908
// 武将添加经验结果
message SCGeneralExpAdd {
  option (msgid) = 1908;
  required bool result = 1;
  optional int32 exp = 2;        // 增加的经验
}

// MsgID: 1909
// 武将升星
message CSGeneralStarUp {
  option (msgid) = 1909;
  required int64 id = 1;
}

// MsgID: 1910
// 武将升星结果
message SCGeneralStarUp {
  option (msgid) = 1910;
  required bool result = 1;
  required string sn = 2;        // 伙伴SN
  required int32 star = 3;
}

// MsgID: 1911
// 武将升品
message CSGeneralQualityUp {
  option (msgid) = 1911;
  required int64 id = 1;
}

// MsgID: 1912
// 武将升品结果
message SCGeneralQualityUp {
  option (msgid) = 1912;
  required bool result = 1;
  required string sn = 2;        // 伙伴SN
}

// MsgID: 1913
// 武将装备强化
message CSGeneralEquipUp {
  option (msgid) = 1913;
  required int64 id = 1;         // 伙伴ID
  required int32 equipSn = 2;    // 装备Sn
}

// MsgID: 1914
// 武将装备强化结果
message SCGeneralEquipUp {
  option (msgid) = 1914;
  required bool result = 1;
}

// MsgID: 1915
// 获取碎片信息
message CSFragInfo {
  option (msgid) = 1915;
}

// MsgID: 1916
// 碎片信息
message SCFragInfo {
  option (msgid) = 1916;
  repeated DFragInfo info = 1;   // 伙伴碎片信息
  optional int32 rareNum = 2;
}

// MsgID: 1917
// 获取单个碎片信息
message CSOneFragInfo {
  option (msgid) = 1917;
  required int32 fragSn = 1;     // 伙伴碎片sn fragSn = 0:可用于兑换稀有伙伴的碎片数量
}

// MsgID: 1918
// 单个碎片信息
message SCOneFragInfo {
  option (msgid) = 1918;
  required int32 sn = 1;         // 碎片SN fragSn = 0:可用于兑换稀有伙伴的碎片数量
  required int32 num = 2;        // 碎片数量
}

// MsgID: 1919
// 出售碎片
message CSSellFrag {
  option (msgid) = 1919;
  repeated int32 fragSn = 1;     // 碎片sn
}

// MsgID: 1920
// 出售碎片结果
message SCSellFrag {
  option (msgid) = 1920;
  required bool result = 1;
}

// MsgID: 1921
// 武将任务战斗次数
message CSGenTaskFightTimes {
  option (msgid) = 1921;
}

// MsgID: 1922
// 武将任务战斗次数
message SCGenTaskFightTimes {
  option (msgid) = 1922;
  repeated DGenTaskFightTimes info = 1;   // 伙伴副本当日剩余挑战次数信息
}

// MsgID: 1923
// 进入武将任务
message CSEnterGeneralTask {
  option (msgid) = 1923;
  required int32 sn = 1;         // 伙伴副本SN
}

// MsgID: 1924
// 进入武将任务
message SCEnterGeneralTask {
  option (msgid) = 1924;
  optional bool result = 1;        // 无注释
  optional int64 enterTime = 2;    // 进入副本的时间
  optional string reason = 3;      // 提示信息
}

// MsgID: 1925
// 武将任务战斗结果
message SCGeneralTaskFightResult {
  option (msgid) = 1925;
  optional bool result = 1;        // 无注释
  optional string reason = 3;      // 提示信息
}

// MsgID: 1926
// 武将任务奖励
message SCGeneralTaskReward {
  option (msgid) = 1926;
  repeated DGeneralTaskReward info = 1;   // 奖励
}

// MsgID: 1927
// 武将上阵
message CSGeneralToAttIng {
  option (msgid) = 1927;
  repeated int64 units = 1;      // 出阵伙伴ID
}

// MsgID: 1928
// 武将上阵结果
message SCGeneralToAttIng {
  option (msgid) = 1928;
  repeated int64 units = 2;      // 出战伙伴ID列表
}

// MsgID: 1929
// 上阵武将信息
message CSGeneralInfoAttIng {
  option (msgid) = 1929;
  required int32 type = 1;       // 阵容类别（副本、爬塔、竞技场）
}

// MsgID: 1930
// 上阵武将信息
message SCGeneralInfoAttIng {
  option (msgid) = 1930;
  required int32 type = 1;       // 阵容类别
  repeated int64 units = 2;      // 出战伙伴ID列表
}

// MsgID: 1931
// 武将移除（服务器响应）
message SCGeneralRemove {
  option (msgid) = 1931;
  required int64 id = 1;
}

// MsgID: 1932
// 选择首选武将
message CSGeneralChooseFirst {
  option (msgid) = 1932;
  required int64 generalId = 1;
}

// MsgID: 1933
// 选择首选武将结果
message SCGeneralChooseFirstResult {
  option (msgid) = 1933;
  required bool success = 1;
}
