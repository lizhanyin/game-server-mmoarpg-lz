// 03201_03300_tower.proto
// 爬塔相关消息 msgid 范围 3201-3300
syntax = "proto2";

package org.gof.demo.worldsrv.msg;

import "google/protobuf/descriptor.proto";
import "options.proto";
import "00000_00000_def.proto";

// ============================================================
// 爬塔相关消息
// ============================================================

// MsgID: 3201
// 所有层信息
message SCAllLayer {
  option (msgid) = 3201;
  repeated DLayerInfo infos = 1;       // 层信息列表
  optional int32 curLayer = 2;         // 当前进行的关卡
  optional int32 refreshCount = 3;     // 剩余刷新次数
  optional int32 buffSn = 4;           // 当前获得的buff
  optional int32 resetBuffCount = 5;   // 更换buff次数
}

// MsgID: 3202
// 进入爬塔层
message CSLayerEnter {
  option (msgid) = 3202;
}

// MsgID: 3203
// 结束爬塔层
message CSLayerEnd {
  option (msgid) = 3203;
}

// MsgID: 3204
// 层结束
message SCLayerEnd {
  option (msgid) = 3204;
  optional int32 layerSn = 1;      // 当前关卡sn
}

// MsgID: 3205
// 离开爬塔层
message CSLayerLeave {
  option (msgid) = 3205;
}

// MsgID: 3206
// 领取爬塔层奖励
message CSLayerAward {
  option (msgid) = 3206;
  optional int32 layerSn = 1;
}

// MsgID: 3207
// 层奖励
message SCLayerAward {
  option (msgid) = 3207;
  optional int32 code = 1;       // 成功
  optional int32 layerSn = 2;    // 关卡sn
}

// MsgID: 3208
// 刷新爬塔层Buff
message CSLayerRefreshBuff {
  option (msgid) = 3208;
}

// MsgID: 3209
// 层刷新Buff
message SCLayerRefreshBuff {
  option (msgid) = 3209;
  optional int32 buffSn = 1;            // 当前获得的buff
  optional int32 resetBuffCount = 2;    // 更换buff次数
}

// MsgID: 3210
// 刷新爬塔
message CSRefreshTower {
  option (msgid) = 3210;
}
