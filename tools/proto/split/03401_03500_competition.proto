// 03401_03500_competition.proto
// 竞技场相关消息 msgid 范围 3401-3500
syntax = "proto2";

package org.gof.demo.worldsrv.msg;

import "google/protobuf/descriptor.proto";
import "options.proto";
import "00000_00000_def.proto";

// ============================================================
// 竞技场相关消息
// ============================================================

// MsgID: 3401
// 进入竞技场
message CSCompetitionEnter {
  option (msgid) = 3401;
  optional int64 humanId = 1;          // 防守者ID
}

// MsgID: 3402
// 结束竞技场
message CSCompetitionEnd {
  option (msgid) = 3402;
}

// MsgID: 3403
// 竞技场结束
message SCCompetitionEnd {
  option (msgid) = 3403;
  optional bool isWin = 1;             // 是否战胜
  optional int32 newRank = 2;          // 新排名
  optional int32 oldRank = 3;          // 上次排名
  optional int64 coin = 4;             // 金币
  optional int64 exp = 5;              // 经验
  optional int64 competMoney = 6;      // 演武币
}

// MsgID: 3404
// 离开竞技场
message CSCompetitionLeave {
  option (msgid) = 3404;
}

// MsgID: 3405
// 刷新敌人
message CSRefreshEnemy {
  option (msgid) = 3405;
}

// MsgID: 3407
// 竞技场信息
message SCCompetitionInfo {
  option (msgid) = 3407;
  repeated DHumanInfo infos = 1;      // 敌人信息
  optional int32 count = 2;           // 可挑战次数
  optional int32 timeCool = 3;         // 冷却时间（毫秒）
}

// MsgID: 3408
// 重置CD
message CSResetCDTime {
  option (msgid) = 3408;
}

// MsgID: 3409
// 重置CD结果
message SCResetCDTime {
  option (msgid) = 3409;
  optional int32 resultCode = 1;       // 大于0成功
}

// MsgID: 3410
// 打开排行榜
message CSOpenRank {
  option (msgid) = 3410;
  optional int32 page = 1;       // 页数
}

// MsgID: 3411
// 排行榜结果
message SCRankResult {
  option (msgid) = 3411;
  repeated DHumanInfo info = 1;    // 排名纪录
  optional int32 curPage = 2;      // 当前页
  optional int32 totalPages = 3;   // 总页数
}

// MsgID: 3412
// 竞技场战斗日志
message CSCompetitionBattleLog {
  option (msgid) = 3412;
}

// MsgID: 3413
// 竞技场战斗日志
message SCCompetitionBattleLog {
  option (msgid) = 3413;
  repeated DBattleLog logs = 1;
}

// MsgID: 3414
// 刷新次数
message CSRefreshCount {
  option (msgid) = 3414;
  required int32 sn = 1;
}

// MsgID: 3415
// 刷新次数
message SCRefreshCount {
  option (msgid) = 3415;
  optional int32 resultCode = 1;       // 大于0成功
}

// MsgID: 3416
// 获取自己的排行榜页面
message CSGetSeflRankPage {
  option (msgid) = 3416;
  required int32 type = 1;
}

// MsgID: 3417
// 获取自己的排行榜页面
message SCGetSeflRankPage {
  option (msgid) = 3417;
  repeated DHumanInfo info = 1;     // 排名纪录
  optional int32 curPage = 2;       // 当前页
  optional int32 totalPages = 3;    // 总页数
}
